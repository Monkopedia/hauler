# Pull-request / main CI gate.
#
# Until now hauler's only workflow was publish.yaml (release-triggered), so PRs
# got no automated checks and style/build debt could accumulate silently. This
# runs the verifiable gate on every PR and on pushes to main.
#
# Scope notes:
#   * The `check` job runs on ubuntu-latest. Only FOUR targets execute tests
#     there — jvm, js, wasmJs, linuxX64. MinGW compiles but `mingwX64Test` is
#     disabled on a Linux host, and the Apple targets neither compile-test nor
#     execute. publish.yaml does NOT cover them: it runs `./gradlew publish` and
#     no test task at all (#50). The apple/windows/linux-arm64 jobs below exist
#     to close that gap (#22) — do not re-describe it as covered elsewhere.
#   * `-x klibApiCheck`: BCV's native-klib ABI check needs all targets (incl.
#     Apple) to build, so it only works on macOS, and no klib baseline is
#     committed yet. The JVM `apiCheck` (run via :hauler:check) still gates the
#     public API. Committing a macOS-generated klib baseline to enable
#     klibApiCheck is a follow-up.
#   * Only :hauler (the published library) is built. The :benchmark module is
#     pre-existingly broken against the 0.4.x Flow API and is intentionally not
#     part of the gate; ktlintCheck still covers its source style.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: SPIKE — prove the guard's REFUSAL paths on this runner
        run: ./.github/selftest_assert_guard.py

      - name: Clear stale test results
        run: rm -rf hauler/build/test-results
      - name: Assemble, test, apiCheck, ktlint
        run: ./gradlew :hauler:assemble :hauler:check ktlintCheck -x klibApiCheck

      - name: Assert the ubuntu suites executed
        if: always()
        run: ./.github/assert_tests_executed.py jvmTest jsNodeTest wasmJsNodeTest linuxX64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu
          path: hauler/build/test-results/**/*.xml
          if-no-files-found: warn

  # Every leg wipes hauler/build/test-results before running. Without it the
  # guard cannot tell "this run's results" from "a previous run's", and on a
  # cached or persistent workspace "never ran" becomes byte-identical to
  # "passed" — the exact defect these jobs exist to eliminate, reintroduced by
  # their own instrument.

  # ── Targets the ubuntu job compiles but never EXECUTES a test for (#22) ──
  # `allTests` on a Linux host reports green while five per-target test tasks are
  # `enabled = false`. These jobs exist to find out what those suites actually do
  # the first time they run. Each prints its task list, because a SKIPPED task
  # inside a passing job produces a green check — the same shape as the defect.

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # macosX64Test reports SKIPPED here: Kotlin disables it at CONFIGURATION
      # time on an arm64 host. That is a DEFAULT, not a limit -- the check is
      # overridable and the x64 binary then runs under Rosetta (measured
      # elsewhere in the fleet; hauler#58 prices it). Listed anyway so the job
      # log records the skip rather than hiding it.
      - name: SPIKE — prove the guard's REFUSAL paths on this runner
        run: ./.github/selftest_assert_guard.py

      - name: Clear stale test results
        run: rm -rf hauler/build/test-results
      - name: Apple tests
        run: ./gradlew :hauler:macosArm64Test :hauler:macosX64Test :hauler:iosSimulatorArm64Test --console=plain
      - name: Which Apple test tasks actually ran
        if: always()
        run: ./gradlew :hauler:macosArm64Test :hauler:macosX64Test :hauler:iosSimulatorArm64Test --dry-run --console=plain
        # ⚠️ --dry-run: prints SKIPPED for EVERY task including ones that really
        # ran. Readable task list, inert as evidence of execution. Do not cite it.

      - name: Assert the Apple suites executed
        if: always()
        run: ./.github/assert_tests_executed.py macosArm64Test iosSimulatorArm64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-apple
          path: hauler/build/test-results/**/*.xml
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: SPIKE — prove the guard's REFUSAL paths on this runner
        shell: bash
        run: ./.github/selftest_assert_guard.py

      - name: Clear stale test results
        shell: bash
        run: rm -rf hauler/build/test-results
      - name: mingwX64 tests
        run: ./gradlew :hauler:mingwX64Test --console=plain

      - name: Assert the mingwX64 suite executed
        if: always()
        shell: bash
        run: ./.github/assert_tests_executed.py mingwX64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: hauler/build/test-results/**/*.xml
          if-no-files-found: warn

  # linuxArm64 has no test task on an x86 host. Cross-compile the test binary
  # here, hand it to a native ARM runner, and execute it there — the pattern
  # Monkopedia/sdbus-kotlin uses in .github/workflows/arm-build-test.yaml.
  linux-arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Link linuxArm64 test binary
        run: ./gradlew :hauler:linkDebugTestLinuxArm64 --console=plain
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: linuxarm64-test-binary
          path: hauler/build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error

  linux-arm64-run:
    needs: linux-arm64-build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: linuxarm64-test-binary
      # Two checks, not one. The equality assertion alone is green in the exact
      # failure it exists to catch: if the binary contains no tests, `ran` is 0 --
      # and an `expected` derived from the same run is 0 too, so 0 == 0 passes.
      # The pre-flight derives `expected` from an UNFILTERED listing instead, so
      # an empty binary fails there. Counts are derived, never hardcoded: a
      # literal would be wrong the first time the suite grows, and then edited
      # downward by whoever hits it, which is how a floor becomes a rubber stamp.
      - name: Execute linuxArm64 tests on real ARM
        run: |
          set -euo pipefail
          chmod +x test.kexe

          # pre-flight: does this binary contain any tests at all?
          ./test.kexe --ktest_list_tests > listing.txt 2>&1 || \
            ./test.kexe --gtest_list_tests > listing.txt 2>&1 || true
          # sed, not grep: a grep matching nothing exits 1, and under `set -e`
          # that reddens the job with a message about the wrong step.
          expected=$(sed -n 's/^[[:space:]][[:space:]][A-Za-z_].*$/&/p' listing.txt | wc -l)
          echo "pre-flight: binary lists $expected test(s)"
          if [ "$expected" -eq 0 ]; then
            echo "::error::Test binary lists ZERO tests. Either the suite is empty, or the"
            echo "::error::listing flag is unsupported and the guard cannot derive a count."
            echo "::error::Do not weaken this check - fix the derivation."
            sed -n '1,20p' listing.txt
            exit 1
          fi

          # the run, plus an equality assertion against the derived count
          ./test.kexe | tee run.txt
          ran=$(sed -n 's/^\[  PASSED  \] \([0-9][0-9]*\) test.*/\1/p' run.txt | tail -1)
          echo "executed: ${ran:-0}   expected: $expected"
          if [ "${ran:-0}" -ne "$expected" ]; then
            echo "::error::Executed ${ran:-0} tests but the binary lists $expected."
            echo "::error::A suite running fewer tests than it contains is the failure this"
            echo "::error::job exists to catch. Do not adjust the expectation to match."
            exit 1
          fi
          echo "linuxArm64: $ran tests executed on real ARM hardware"
